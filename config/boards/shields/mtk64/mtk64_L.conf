# Peripheral（左）ではUSBを有効化しない
CONFIG_ZMK_USB=n

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y

# ★ 電池駆動時に A / Z が反応しづらい対策（2026-10-15）
# チャーリープレックスはピンを切り替えた直後に読み取る（既定 0µs）。
# 接触がギリギリのキーは信号が落ち着く前に読まれて取りこぼすので、少し待ってから読む。
# 単位はマイクロ秒（k_busy_wait）。1スキャン 7本 × 5µs 程度なので反応速度への影響はほぼ無い。
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=5
